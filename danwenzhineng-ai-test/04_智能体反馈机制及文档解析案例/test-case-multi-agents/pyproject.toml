[project]
name = "test-case-multi-agents"
version = "0.1.0"
description = "AutoGen multi-agent workflow for generating, reviewing, and human-approving test cases."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "autogen-agentchat==0.7.5",
    "autogen-ext[openai]==0.7.5",
    "fastapi>=0.115.0",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "reportlab>=4.0.0",
]

[project.scripts]
test-case-agents = "test_case_multi_agents.main:cli"
test-case-agents-api = "test_case_multi_agents.api:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
