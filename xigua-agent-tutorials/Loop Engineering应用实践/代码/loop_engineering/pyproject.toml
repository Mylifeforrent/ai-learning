[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-engineering-docs-agent"
version = "0.1.0"
description = "A modular Python implementation of LangChain's four loop-engineering levels using a documentation-improvement agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "langchain==1.3.14",
  "langchain-deepseek>=1.1.0",
  "langchain-openai==1.4.0",
  "langgraph==1.2.9",
  "langsmith==0.10.7",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "rich>=14,<15",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-cov>=6.2,<7", "ruff>=0.12,<1"]

[project.scripts]
docs-loop = "loop_engineering.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
