<!-- S005 Layered Container Model - Yellow - cargo container packing animation -->
<style>
  #cargo-frame {
    width: clamp(480px, 58vw, 760px);
    height: clamp(260px, 38vh, 370px);
    border: 3px solid var(--primary);
    border-radius: 1rem;
    position: relative;
    display: grid;
    grid-template-columns: 5fr 4fr 3fr 3fr;
    grid-template-rows: 5fr 3fr;
    gap: 6px;
    padding: 6px;
    background: rgba(45,90,122,0.03);
  }
  .cargo-item {
    border-radius: 0.6rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease, opacity 0.6s ease;
    position: relative;
    opacity: 0;
    transform: translateY(12px);
  }
  .cargo-item.loaded {
    opacity: 1;
    transform: translateY(0);
  }
  .cargo-item:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(45,90,122,0.18);
    z-index: 10;
  }
  .cargo-item.highlight {
    box-shadow: 0 0 0 3px var(--accent), 0 6px 20px rgba(193,127,89,0.25);
  }
  .cargo-item.highlight:hover {
    box-shadow: 0 0 0 3px var(--accent), 0 10px 28px rgba(193,127,89,0.3);
  }
  .cargo-name {
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: clamp(0.82rem, 1.2vw, 1rem);
    text-align: center;
    line-height: 1.2;
  }
  .cargo-pct {
    font-size: clamp(0.72rem, 1vw, 0.88rem);
    font-weight: 600;
    margin-top: 0.15rem;
  }
  .cargo-tag {
    font-size: 0.62rem;
    font-weight: 600;
    padding: 0.1rem 0.45rem;
    border-radius: 0.3rem;
    margin-top: 0.25rem;
    letter-spacing: 0.03em;
  }
  /* Small boxes: tighter text */
  .cargo-sm .cargo-name { font-size: clamp(0.7rem, 1vw, 0.85rem); }
  .cargo-sm .cargo-pct  { font-size: clamp(0.65rem, 0.9vw, 0.78rem); }

  /* Detail bar below container */
  #detail-bar {
    width: clamp(480px, 58vw, 760px);
    min-height: 2.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    font-size: clamp(0.95rem, 1.5vw, 1.1rem);
    color: var(--text-dim);
    transition: opacity 0.3s ease;
    text-align: center;
    line-height: 1.5;
  }
  #detail-bar .detail-icon {
    font-size: 1rem;
    flex-shrink: 0;
  }
</style>

<div style="width:100%;max-width:900px;">

  <div class="slide-header" style="text-align:center;">
    <span class="chapter-badge">第一章：认知升维</span>
    <h1 class="slide-title" style="font-size:clamp(1.6rem,3vw,2.5rem);margin-top:0.5rem;">分层容器模型：上下文窗口全景</h1>
  </div>

  <div class="slide-content" style="display:flex;flex-direction:column;align-items:center;gap:0.8rem;">

    <!-- Cargo container -->
    <div id="cargo-frame">

      <!-- Row 1: Two big cargo boxes -->
      <div class="cargo-item" data-id="history" style="grid-column:1/3;grid-row:1;background:rgba(45,90,122,0.10);">
        <div class="cargo-name" style="color:var(--primary);">对话历史</div>
        <div class="cargo-pct" style="color:var(--primary);">20-40%</div>
        <span class="cargo-tag" style="background:rgba(193,127,89,0.12);color:var(--accent);">动态</span>
      </div>

      <div class="cargo-item" data-id="tools" style="grid-column:3/5;grid-row:1;background:rgba(193,127,89,0.08);">
        <div class="cargo-name" style="color:var(--accent);">工具上下文</div>
        <div class="cargo-pct" style="color:var(--accent);">15-30%</div>
        <span class="cargo-tag" style="background:rgba(193,127,89,0.12);color:var(--accent);">动态</span>
      </div>

      <!-- Row 2: Four smaller cargo boxes -->
      <div class="cargo-item cargo-sm" data-id="knowledge" style="grid-column:1;grid-row:2;background:rgba(166,195,225,0.18);">
        <div class="cargo-name" style="color:var(--primary);">外部知识</div>
        <div class="cargo-pct" style="color:var(--text-dim);">10-20%</div>
        <span class="cargo-tag" style="background:rgba(166,195,225,0.25);color:var(--primary);">外部</span>
      </div>

      <div class="cargo-item cargo-sm" data-id="system" style="grid-column:2;grid-row:2;background:rgba(45,90,122,0.06);">
        <div class="cargo-name" style="color:var(--primary);">系统提示</div>
        <div class="cargo-pct" style="color:var(--text-dim);">5-15%</div>
        <span class="cargo-tag" style="background:rgba(45,90,122,0.1);color:var(--primary);">静态</span>
      </div>

      <div class="cargo-item cargo-sm" data-id="memory" style="grid-column:3;grid-row:2;background:rgba(193,127,89,0.06);">
        <div class="cargo-name" style="color:var(--accent);">记忆注入</div>
        <div class="cargo-pct" style="color:var(--text-dim);">5-10%</div>
        <span class="cargo-tag" style="background:rgba(193,127,89,0.1);color:var(--accent);">按需</span>
      </div>

      <div class="cargo-item cargo-sm" data-id="task" style="grid-column:4;grid-row:2;background:rgba(166,195,225,0.10);">
        <div class="cargo-name" style="color:var(--primary);">任务状态</div>
        <div class="cargo-pct" style="color:var(--text-dim);">5-10%</div>
        <span class="cargo-tag" style="background:rgba(166,195,225,0.18);color:var(--primary);">持久</span>
      </div>
    </div>

    <!-- Detail bar (updates on hover/click) -->
    <div id="detail-bar">
      <span class="detail-icon"></span>
      <span id="detail-text" style="opacity:0.6;">hover 任意货箱查看模块简介</span>
    </div>

    <!-- Emphasis conclusion -->
    <div id="s005-emphasis" style="opacity:0;transition:opacity 0.6s ease;">
      <div style="display:inline-flex;align-items:center;gap:0.8rem;background:rgba(193,127,89,0.1);border:1px solid rgba(193,127,89,0.3);border-radius:0.6rem;padding:0.5rem 1.5rem;">
        <span style="font-family:var(--font-heading);font-weight:700;color:var(--accent);font-size:clamp(0.9rem,1.8vw,1.15rem);">
          对话历史 + 工具上下文 &asymp; 合计 &gt; 50%
        </span>
        <span style="font-size:0.78rem;color:var(--text-dim);">首要优化目标</span>
      </div>
    </div>

  </div>
</div>

<script>
(function(){
  var items = document.querySelectorAll('.cargo-item');
  var detailText = document.getElementById('detail-text');
  var detailIcon = document.querySelector('.detail-icon');
  var emphasis = document.getElementById('s005-emphasis');

  var info = {
    history:   { icon: '\uD83D\uDCAC', text: 'Agent\u7684\u201C\u77ED\u671F\u8BB0\u5FC6\u201D\uFF0C\u589E\u957F\u6700\u5FEB\u300220\u8F6E\u5BF9\u8BDD\u53EF\u5360 8K+ token\u3002\u6838\u5FC3\u51B3\u7B56\uFF1A\u4FDD\u7559\u591A\u5C11\u8F6E\u3001\u4F55\u65F6\u538B\u7F29\u3001\u6458\u8981\u653E\u54EA\u91CC\u3002' },
    tools:     { icon: '\uD83D\uDEE0', text: 'Agent\u7684\u201C\u80FD\u529B\u58F0\u660E\u201D\u3002100\u4E2A\u5DE5\u5177\u53EF\u5360 30-40% \u7A97\u53E3\uFF01\u5206\u7EA7\u7BA1\u7406\uFF1A\u5168\u91CF / \u52A8\u6001 / \u6761\u4EF6\u6CE8\u5165 / MCP \u53D1\u73B0\u3002' },
    knowledge: { icon: '\uD83D\uDCDA', text: 'Agent\u7684\u201C\u56FE\u4E66\u9986\u201D\u3002RAG \u68C0\u7D22 vs \u5168\u4E0A\u4E0B\u6587\u52A0\u8F7D\uFF0C\u6210\u672C\u5DEE\u8DDD 1250x\u3002\u884C\u4E1A\u5171\u8BC6\uFF1ARAG \u9ED8\u8BA4 + \u957F\u4E0A\u4E0B\u6587\u8865\u5145\u3002' },
    system:    { icon: '\u2699\uFE0F', text: 'Agent\u7684\u201C\u64CD\u4F5C\u7CFB\u7EDF\u201D\u3002\u591A\u5C42 Markdown \u62FC\u63A5\uFF0C\u9759\u6001\u4E0D\u53D8\uFF0C\u5929\u7136\u9002\u5408 Prompt Caching\u3002\u901A\u5E38 2K-10K token\u3002' },
    memory:    { icon: '\uD83D\uDD17', text: '\u4F9B\u7ED9\u4FA7\u2192\u6D88\u8D39\u4FA7\u63A5\u53E3\u3002mem0.search() \u6309\u9700\u68C0\u7D22\uFF0C\u5206\u56DB\u7C7B\u578B\u6CE8\u5165\u7CFB\u7EDF\u63D0\u793A\u3002Just-in-time \u539F\u5219\u3002' },
    task:      { icon: '\uD83D\uDCD3', text: 'Agent\u7684\u201C\u5DE5\u4F5C\u7B14\u8BB0\u672C\u201D\u3002Scratchpad \u6A21\u5F0F\u4FDD\u4F4F\u8DE8\u8F6E\u6B21\u72B6\u6001\u3002\u6CA1\u6709\u5B83\uFF0C\u538B\u7F29\u540E\u4F1A\u201C\u65AD\u7247\u201D\u3002' }
  };

  // Loading animation: big boxes first
  var order = ['history', 'tools', 'knowledge', 'system', 'memory', 'task'];
  var delays = [600, 1100, 1600, 1900, 2200, 2500];

  order.forEach(function(id, i) {
    var el = document.querySelector('.cargo-item[data-id="' + id + '"]');
    if (!el) return;
    setTimeout(function() {
      el.classList.add('loaded');
    }, delays[i]);
  });

  // Hover: update detail bar
  items.forEach(function(item) {
    item.addEventListener('mouseenter', function() {
      var d = info[item.dataset.id];
      if (!d) return;
      detailIcon.textContent = d.icon;
      detailText.textContent = d.text;
      detailText.style.opacity = '1';
    });
    item.addEventListener('mouseleave', function() {
      if (!activeId) {
        detailIcon.textContent = '';
        detailText.textContent = 'hover \u4EFB\u610F\u8D27\u7BB1\u67E5\u770B\u6A21\u5757\u7B80\u4ECB';
        detailText.style.opacity = '0.6';
      } else {
        var d = info[activeId];
        detailIcon.textContent = d.icon;
        detailText.textContent = d.text;
        detailText.style.opacity = '1';
      }
    });
  });

  // Click: persistent selection
  var activeId = null;
  var clicked = {};
  items.forEach(function(item) {
    item.addEventListener('click', function() {
      activeId = item.dataset.id;
      clicked[activeId] = true;
      items.forEach(function(it) { it.style.outline = ''; });
      item.style.outline = '2px solid var(--primary)';
      item.style.outlineOffset = '-2px';
      var d = info[activeId];
      detailIcon.textContent = d.icon;
      detailText.textContent = d.text;
      detailText.style.opacity = '1';
      // Check if all 6 clicked
      if (Object.keys(clicked).length >= 6) triggerEmphasis();
    });
  });

  // Auto-trigger emphasis after all loaded + 4s idle
  var emphasisDone = false;
  function triggerEmphasis() {
    if (emphasisDone) return;
    emphasisDone = true;
    var h = document.querySelector('.cargo-item[data-id="history"]');
    var t = document.querySelector('.cargo-item[data-id="tools"]');
    if (h) h.classList.add('highlight');
    if (t) t.classList.add('highlight');
    emphasis.style.opacity = '1';
  }
  setTimeout(triggerEmphasis, delays[5] + 4000);
})();
</script>
